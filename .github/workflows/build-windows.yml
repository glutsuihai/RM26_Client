name: Build and Package for Windows (Manual Qt Setup)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 180
    
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      # 2. 设置 Python 3.10
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 手动安装 Qt6 (解决 XML 解析错误)
      - name: 手动安装 Qt6
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade aqtinstall
          
          Write-Host "====== 诊断：列出可用的模块 ======"
          python -m aqt list-qt windows desktop --modules 6.6.0 win64_msvc2022_64
          
          Write-Host "====== 开始安装 Qt6 ======"
          # 创建 Qt 目录
          New-Item -ItemType Directory -Force -Path "C:\Qt"
          
          # 使用 --arch 显式指定，并移除独立的 qttest
          python -m aqt install-qt windows desktop 6.6.0 --arch win64_msvc2022_64 -O C:\Qt -m qtmultimedia qtserialport qtsvg qtquickcontrols2 qtdeclarative
          
          # 写入环境变量
          echo "Qt6_DIR=C:\Qt\6.6.0\msvc2022_64" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=C:\Qt\6.6.0\msvc2022_64" >> $env:GITHUB_ENV
          echo "C:\Qt\6.6.0\msvc2022_64\bin" >> $env:GITHUB_PATH

      # 4. 配置 vcpkg
      - name: 配置 vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'a42af01b72c28a8e1d7b48107b33e4f286a55ef6'
          doNotCache: false

      # 5. 安装 C++ 依赖
      - name: 安装 C++ 依赖
        run: |
          vcpkg install protobuf:x64-windows abseil:x64-windows paho-mqtt:x64-windows ffmpeg:x64-windows

      # 6. 配置 CMake
      - name: 配置 CMake
        run: |
          cmake -B build -S . -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"

      # 7. 编译
      - name: 编译项目
        run: cmake --build build --config Release --parallel

      # 8. 打包
      - name: 收集依赖并打包
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          
          # ⚠️ 修改：把 your_app_name.exe 换成你真实的 exe 名字
          Copy-Item "build\Release\your_app_name.exe" -Destination dist\ -ErrorAction SilentlyContinue
          
          Copy-Item "config.example.json" -Destination dist\ -ErrorAction SilentlyContinue
          Copy-Item "resources" -Destination dist\ -Recurse -ErrorAction SilentlyContinue
          
          windeployqt dist\your_app_name.exe
          
          $vcpkgBin = "${{ github.workspace }}\vcpkg\installed\x64-windows\bin"
          if (Test-Path $vcpkgBin) {
            Copy-Item "$vcpkgBin\*.dll" -Destination dist\ -Force -ErrorAction SilentlyContinue
          }
          Copy-Item "C:\Windows\System32\vcruntime140.dll" -Destination dist\ -ErrorAction SilentlyContinue
          Copy-Item "C:\Windows\System32\msvcp140.dll" -Destination dist\ -ErrorAction SilentlyContinue
          
          Compress-Archive -Path dist\* -DestinationPath your_app_windows_x64.zip

      # 9. 上传产物
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: your_app_windows_x64.zip
